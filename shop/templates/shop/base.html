<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        header { background: #333; color: white; padding: 15px; text-align: center; }
        nav a { color: white; margin: 0 10px; text-decoration: none; }
        .container { max-width: 1000px; margin: 20px auto; display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 220px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .price { color: #e44d26; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <header>
        <h2>Мой Магазин</h2>
        <nav>
            <a href="/">Все товары</a>
            <a href="/recent/">Новинки</a>
            <a href="/admin/">Админка</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
